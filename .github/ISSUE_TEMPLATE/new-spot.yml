name: "⛺ Suggest a wild camping spot"
description: Share a spot for the WildCamp Ireland map
title: "New spot: "
labels: [spot-submission]
body:
  - type: input
    id: name
    attributes:
      label: Spot name
      placeholder: e.g. Lough Example shore
    validations:
      required: true
  - type: input
    id: county
    attributes:
      label: County
      placeholder: e.g. Kerry
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options: [Beach, Lough, Mountain, Forest, Coast, Island, Trail, River]
    validations:
      required: true
  - type: input
    id: coords
    attributes:
      label: Coordinates (lat, lng)
      description: Long-press in Google Maps or tap the map in the app to get these
      placeholder: "53.12345, -6.54321"
  - type: textarea
    id: desc
    attributes:
      label: Description, access & facilities
      description: What's it like? Parking, walk-in distance, water, nearest pub…
    validations:
      required: true
  - type: checkboxes
    id: lnt
    attributes:
      label: Responsible sharing
      options:
        - label: This spot can handle visitors and isn't a fragile habitat or someone's garden
          required: true
